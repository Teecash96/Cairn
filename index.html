<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves inside the Nimiq Pay WebView -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <!-- Both themes are first-class; the WebView picks per the device setting. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0e13" />
    <meta
      name="description"
      content="Describe an idea in plain language and get a structured PRD and a visual user flow in seconds. Pay per plan in NIM — no account, no subscription."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Cairn" />
    <link rel="canonical" href="https://cairn.cairn-planner.workers.dev/" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#4f46e5" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cairn" />
    <meta property="og:url" content="https://cairn.cairn-planner.workers.dev/" />
    <meta property="og:title" content="Cairn. Make the idea easier to build." />
    <meta
      property="og:description"
      content="Turn a rough product idea into a clear brief, user flow, and practical builder pack."
    />
    <meta property="og:image" content="https://cairn.cairn-planner.workers.dev/social-card.svg" />
    <meta property="og:image:alt" content="Cairn turns a rough idea into a product plan." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cairn. Make the idea easier to build." />
    <meta
      name="twitter:description"
      content="Turn a rough product idea into a clear brief, user flow, and practical builder pack."
    />
    <meta name="twitter:image" content="https://cairn.cairn-planner.workers.dev/social-card.svg" />
    <meta name="twitter:image:alt" content="Cairn turns a rough idea into a product plan." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Cairn",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Turn a rough product idea into a clear brief, user flow, and practical builder pack.",
        "url": "https://cairn.cairn-planner.workers.dev/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NIM",
          "description": "Three free plans are available. Additional plans are paid in NIM."
        }
      }
    </script>
    <title>Cairn. Make the idea easier to build.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
