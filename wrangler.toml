# Cairn — Cloudflare Worker
#
# One Worker serves both the built app and `/api/*`, so the client is same-origin
# and needs no base URL or CORS in production.
#
# Nothing secret lives in this file. The Anthropic key is set with
# `wrangler secret put ANTHROPIC_API_KEY` (encrypted binding), and locally in
# `.dev.vars`, which is gitignored.

name = "cairn"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Static assets. Requests that match a built file are served from the edge
# without invoking the Worker at all, which is what keeps first paint fast.
#
# `not_found_handling = "none"` deliberately: Cairn has no client-side router.
# Share links are query parameters (`/?s=<id>&g=<token>`) precisely so that no
# rewrite rule stands between a shared link and a rendered app. Single-page-app
# handling would also swallow `/api/*` before the Worker ever ran.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

# Credits, share snapshots, gift tokens, spent receipts, budget counters.
# Create with: wrangler kv namespace create CAIRN
#          and wrangler kv namespace create CAIRN --preview
[[kv_namespaces]]
binding = "CAIRN"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[vars]
# Where payments go. Public information — this is the app's receiving address,
# and the client is told it in the price quote.
PAY_TO = "REPLACE_WITH_NIMIQ_ADDRESS"

# --- Pricing -----------------------------------------------------------------
# Amounts are LUNA. 1 NIM = 100,000 Luna.
#
# TODO(price): 1,000,000 Luna = 10 NIM is a PLACEHOLDER. NIM's spot price has not
# been checked. The rule the number has to satisfy: a bundle should cost roughly
# what the inference actually costs, because the app's claim — "you're paying for
# the AI, not a subscription" — is meant literally. Set this before deploying.
PRICE_LUNA = "1000000"
PLANS_PER_PAYMENT = "10"

# Free generations granted to a new wallet, capped per device (see credits.ts).
FREE_PLANS = "3"

# Hard ceiling on generations per UTC day, across all users. This is the backstop
# that makes it impossible for anyone to run up an unbounded Anthropic bill.
DAILY_BUDGET = "400"

# Read the receiving address's incoming transactions to verify a payment.
#
# TODO(rpc): UNVERIFIED — no public Albatross endpoint has been confirmed. Until
# one is set here, `/api/redeem` fails closed and grants nothing (payments.ts).
NIMIQ_RPC_URL = ""

# Absolute base for share links. Leave empty to derive it from the request, which
# is correct in production; set it when the app and the Worker are on different
# hosts, i.e. `vite dev` on :5173 talking to `wrangler dev` on :8787.
APP_URL = ""
