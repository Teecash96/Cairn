# Cairn — Cloudflare Worker
#
# One Worker serves both the built app and `/api/*`, so the client is same-origin
# and needs no base URL or CORS in production.
#
# Nothing secret lives in this file. The Gemini key is set with
# `wrangler secret put GEMINI_API_KEY` (encrypted binding), and locally in
# `.dev.vars`, which is gitignored.

name = "cairn"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Static assets. Route them through the Worker so the response security headers
# apply to the app, not only to API responses. The asset binding still serves the
# file from Cloudflare's edge; `run_worker_first` only keeps the header policy in
# one place.
#
# `not_found_handling = "none"` deliberately: Cairn has no client-side router.
# Share links are query parameters (`/?s=<id>`) precisely so that no
# rewrite rule stands between a shared link and a rendered app. Single-page-app
# handling would also swallow `/api/*` before the Worker ever ran.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# Share snapshots, wallet sessions, team records, rate limits, and budget counters.
# Create with: wrangler kv namespace create CAIRN
#          and wrangler kv namespace create CAIRN --preview
[[kv_namespaces]]
binding = "CAIRN"
id = "d8f3f5427e3a405aa8c81da1941a1c38"
preview_id = "e9d8888ac4344658be9fa668ab85bd0d"

[vars]
# Current Gemini Generate Content API model. Keep this explicit so a local and a
# deployed Worker cannot silently drift to different model behavior.
GEMINI_MODEL = "gemini-3.1-flash-lite"

# Hard ceiling on generations per UTC day, across all users. This is the backstop
# that makes it impossible for anyone to run up an unbounded Gemini bill.
DAILY_BUDGET = "400"

# Absolute base for share links. Leave empty to derive it from the request, which
# is correct in production; set it when the app and the Worker are on different
# hosts, i.e. `vite dev` on :5173 talking to `wrangler dev` on :8787.
APP_URL = "https://cairn.cairn-planner.workers.dev"
