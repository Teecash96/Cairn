# Cairn — Cloudflare Worker
#
# One Worker serves both the built app and `/api/*`, so the client is same-origin
# and needs no base URL or CORS in production.
#
# Nothing secret lives in this file. The Gemini key is set with
# `wrangler secret put GEMINI_API_KEY` (encrypted binding), and locally in
# `.dev.vars`, which is gitignored.

name = "cairn"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Keep enough privacy-safe service health data to detect slow or failing API
# categories. Invocation logs are disabled because they can include request
# metadata. Cairn emits only category, method, status, and duration, sampled at
# ten percent; it never logs prompts, URLs, ids, wallets, or request bodies.
[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

# Static assets. Route them through the Worker so the response security headers
# apply to the app, not only to API responses. The asset binding still serves the
# file from Cloudflare's edge; `run_worker_first` only keeps the header policy in
# one place.
#
# `not_found_handling = "none"` deliberately: Cairn has one explicit client
# route (`/usage`) that the Worker rewrites to the app shell itself.
# Share links are query parameters (`/?s=<id>`) precisely so that no
# rewrite rule stands between a shared link and a rendered app. Single-page-app
# handling would also swallow `/api/*` before the Worker ever ran.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# Share snapshots, wallet sessions, team records, rate limits, and budget counters.
# Create with: wrangler kv namespace create CAIRN
#          and wrangler kv namespace create CAIRN --preview
[[kv_namespaces]]
binding = "CAIRN"
id = "d8f3f5427e3a405aa8c81da1941a1c38"
preview_id = "e9d8888ac4344658be9fa668ab85bd0d"

[vars]
# Current Gemini Generate Content API model. Keep this explicit so a local and a
# deployed Worker cannot silently drift to different model behavior.
GEMINI_MODEL = "gemini-3.1-flash-lite"

# Legacy credit quote retained for old paid receipts and ledger compatibility.
# New plans and refinements are free. Direct teammate rewards use the assigned
# teammate's address instead of this legacy receiving address.
PAY_TO = "NQ19 E39Q Y9EQ 937E YQYC 13D2 4LCC UPTN 3VPS"
PRICE_LUNA = "100000"
PLANS_PER_PAYMENT = "10"
NIMIQ_RPC_URL = "https://rpc.nimiqwatch.com"

# Hard ceiling on generations per UTC day, across all users. This is the backstop
# that makes it impossible for anyone to run up an unbounded Gemini bill.
DAILY_BUDGET = "400"

# Absolute base for share links. Leave empty to derive it from the request, which
# is correct in production; set it when the app and the Worker are on different
# hosts, i.e. `vite dev` on :5173 talking to `wrangler dev` on :8787.
APP_URL = "https://cairn.cairn-planner.workers.dev"

# Enabled only after the production KV ledger was frozen and reconciled.
# See docs/credit-ledger-cutover.md.
CREDIT_LEDGER_READY = "1"

[[durable_objects.bindings]]
name = "CREDIT_LEDGER"
class_name = "CreditLedger"

[[durable_objects.bindings]]
name = "TEAM_COORDINATOR"
class_name = "TeamCoordinator"

[[durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedger"

[[migrations]]
tag = "v1-credit-ledger"
new_sqlite_classes = ["CreditLedger"]


[[migrations]]
tag = "v2-team-coordinator"
new_sqlite_classes = ["TeamCoordinator"]

[[migrations]]
tag = "v3-usage-ledger"
new_sqlite_classes = ["UsageLedger"]
