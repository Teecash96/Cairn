<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cairn</title>
  <desc id="desc">Turn a rough idea into a clear product plan and user flow.</desc>
  <rect width="1200" height="630" fill="#fbfbfd" />
  <rect x="72" y="72" width="104" height="104" rx="24" fill="#4f46e5" />
  <g fill="#ffffff">
    <rect x="110" y="95" width="28" height="18" rx="7" />
    <rect x="98" y="120" width="52" height="18" rx="7" />
    <rect x="88" y="145" width="72" height="18" rx="7" />
  </g>
  <text x="72" y="300" fill="#14161c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="86" font-weight="750" letter-spacing="-3">Cairn</text>
  <text x="76" y="382" fill="#585e70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40">Make the idea easier to build.</text>
  <text x="76" y="460" fill="#4f46e5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650">PRD  ·  USER FLOW  ·  BUILDER PACK</text>
