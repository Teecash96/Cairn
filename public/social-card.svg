  </defs>

  <rect width="1200" height="630" fill="#f2efe7"/>
  <path d="M0 552 C145 468 235 518 344 487 S548 416 665 449 S822 512 935 390" fill="none" stroke="#2457d6" stroke-width="10" stroke-linecap="round"/>

