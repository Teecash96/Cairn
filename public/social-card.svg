    <text x="54" y="246" font-size="72" font-weight="900" letter-spacing="-3">TO WORK THAT SHIPS.</text>
    <text x="58" y="304" font-size="23" fill="#5b6257">Plan · Focus · Validate · Collaborate · Reward · Release</text>
  </g>

