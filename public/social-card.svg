<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Cairn. From rough idea to work that ships.</title>
  <desc id="description">A route connects planning, focus, proof, and release beside a stack of cairn stones.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3974ef"/>
      <stop offset="1" stop-color="#173b99"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd34e"/>
      <stop offset="1" stop-color="#f3ad13"/>
