<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cairn">
  <title>Cairn</title>
  <!-- Indigo ground with white stones: highest contrast at 16px, and it reads
       the same against light or dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#4f46e5" />
  <g fill="#ffffff">
    <rect x="25" y="15" width="14" height="9" rx="4.5" />
    <rect x="19" y="27.5" width="26" height="9" rx="4.5" />
    <rect x="14" y="40" width="36" height="9" rx="4.5" />
  </g>
</svg>
