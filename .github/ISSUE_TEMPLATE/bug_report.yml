name: Bug report
description: Report a reproducible Cairn problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include private keys, seed phrases, API keys, or confidential plan text.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, browser or Nimiq Pay version, and Cairn URL.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add a redacted screenshot or public transaction hash if useful.
